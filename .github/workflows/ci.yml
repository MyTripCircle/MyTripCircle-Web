name: CI

# Intégration continue : à chaque push sur main et à chaque pull request,
# installation propre des dépendances, vérification de types, exécution de la
# suite de tests (client + serveur) avec couverture, et audit des dépendances.

on:
  push:
    branches: [main]
  pull_request:

# Annule un run en cours si un nouveau commit est poussé sur la même réf.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, tests & audit
    runs-on: ubuntu-latest
    env:
      # Booléen dérivé du secret : permet de conditionner l'étape SonarCloud
      # sans exposer le jeton aux autres étapes du job (`secrets` n'est pas
      # utilisable dans un `if`).
      HAS_SONAR_TOKEN: ${{ secrets.SONAR_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Historique complet : requis pour l'analyse SonarCloud (git blame).
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      # `--legacy-peer-deps` compense un conflit de dépendances pairs :
      # `@react-navigation/drawer` réclame `react-native-reanimated`, dont la
      # version 4 exige React Native 0.83 à 0.87 quand ce projet est en 0.81.5.
      # Le verrou fige une résolution qui fonctionne ; le drapeau ne fait
      # qu'autoriser npm à l'appliquer. Dette à résorber en alignant ces
      # versions, après quoi ce drapeau doit disparaître.
      - name: Installer les dépendances
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: Vérification de types (TypeScript)
        run: npm run typecheck

      - name: Tests + couverture (client)
        run: npm run test:coverage -- --ci

      - name: Publier le rapport de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      # Le bundle web est l'artefact livrable du projet : un échec de build doit
      # casser la CI, même quand types et tests passent.
      - name: Build web
        run: npm run build

      - name: Publier le bundle web
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: dist/
          retention-days: 14

      - name: Audit des dépendances
        run: npm audit --audit-level=high
        # Non bloquant : informatif tant que les vulnérabilités connues ne sont
        # pas toutes traitées. Durcir (audit-level=moderate, ou retirer
        # continue-on-error) une fois le backlog de sécurité résorbé.
        continue-on-error: true

      # Analyse depuis la CI et non par l'analyse automatique SonarCloud : le
      # rapport de couverture coverage/lcov.info n'existe qu'après les tests.
      - name: Analyse SonarCloud
        # Le plan SonarCloud n'analyse que la branche principale et les pull
        # requests : sur les autres pushes, le rapport serait envoyé puis ignoré.
        if: env.HAS_SONAR_TOKEN == 'true' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
        # Action tierce épinglée sur un SHA de commit : un tag reste mutable et
        # pourrait être repointé vers du code malveillant (règle Sonar S7637).
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
