sonar.projectKey=MyTripCircle_MyTripCircle-Web
sonar.organization=mytripcircle

# Encodage des sources, sinon le scanner retombe sur celui de la plateforme.
sonar.sourceEncoding=UTF-8

# Périmètre analysé : tout le dépôt, moins les dépendances installées, le bundle
# web généré, les ressources statiques et le rapport de couverture.
sonar.sources=.
sonar.exclusions=node_modules/**,coverage/**,dist/**,public/**,assets/**

# Exclure les fichiers i18n et les données statiques de la détection de duplication.
# Les fichiers de traduction partagent la même structure de clés par conception (une par langue),
# et les fiches de destination ont un schéma commun intentionnel.
sonar.cpd.exclusions=src/utils/i18n/**,src/data/**

# `sonar.tests` désigne la même racine que `sonar.sources` : pointé vers src/,
# il faisait considérer tout ce répertoire comme du code de test et l'écartait
# de l'analyse (défaut déjà corrigé sur le client mobile le 16/08).
sonar.tests=.
sonar.test.inclusions=**/__tests__/**/*.test.ts,**/__tests__/**/*.test.tsx,**/__tests__/**/*.test.js

# Couverture : rapport LCOV généré par `npm run test:coverage` dans la CI.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Seul le code sans logique est retiré de la mesure. Contrairement au
# périmètre Jest, restreint à la logique métier, SonarCloud mesure aussi les
# écrans et composants : son pourcentage est donc plus bas, et c'est le chiffre
# qui décrit l'ensemble du client web.
sonar.coverage.exclusions=**/__tests__/**,**/*.d.ts,src/types/**,src/data/**,src/utils/i18n/**,*.config.js,coverage/**,dist/**
